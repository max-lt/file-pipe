[package]
name = "file-pipe"
version = "0.1.0"
edition = "2024"
description = "HTTP pipe service — stream uploads to downloads in real-time"
repository = "https://github.com/max-lt/file-pipe"
keywords = ["http", "pipe", "streaming", "upload", "s3"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
multer = "3.1.0"
dashmap = "6.1.0"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"], optional = true }

[features]
default = []
forward = ["dep:reqwest"]

[dev-dependencies]
reqwest = { version = "0.13", features = ["stream", "multipart"] }
futures = "0.3"
tempfile = "3"
